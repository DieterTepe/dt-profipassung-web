# Prueft alle Links, Bilder und Videos der Seite auf Erreichbarkeit.
# Laeuft nach jeder Veroeffentlichung und zusaetzlich jeden Montag (falls extern etwas wegfaellt).
# 503 (Server kurz ueberlastet, z. B. GitHub Pages) zaehlt nicht als kaputter Link; 404 usw. weiterhin schon.
name: Links pruefen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Warten, bis GitHub Pages neue Seiten ausliefert (sonst falsche 404)
        if: github.event_name == 'push'
        run: sleep 150

      - name: Links, Bilder und Videos pruefen
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --max-retries 5
            --retry-wait-time 20
            --max-concurrency 4
            --accept 200,206,429,503
            --exclude "checkout-ds24\.com"
            --exclude "localhost"
            --exclude "linkedin\.com"
            --exclude "reddit\.com"
            --exclude-path "google[0-9a-f]+\.html"
            './**/*.html'
